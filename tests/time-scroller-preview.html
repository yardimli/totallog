<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time scroller interaction check</title>
<link rel="stylesheet" href="../resources/css/app.css">
<style>
body { background: #101525; color: white; font: 16px system-ui; padding: 24px; }
main { max-width: 400px; margin: auto; }
button { width: 100%; padding: 8px; border: 1px solid #475569; border-radius: 12px; background: #1e293b; color: white; font: bold 18px system-ui; }
</style>
<main>
<h1>Day image time picker</h1>
<p>24-hour</p>
<div id="picker"><button type="button"></button><input type="hidden" value="12:00"></div>
<p>AM / PM</p>
<div id="twelve"><button type="button"></button><input type="hidden" value="18:00"></div>
<p>Narrow layout · start of day</p>
<div id="narrow" style="width:240px;max-width:100%"><button type="button"></button><input type="hidden" value="00:00"></div>
<p id="result">Checking interactions…</p>
</main>
<script type="module">
import {initTimeScroller} from '../resources/js/time-scroller.mjs';
document.documentElement.classList.add('dark');
const picker = document.querySelector('#picker');
const input = picker.querySelector('input');
initTimeScroller(picker, input, picker.querySelector('button'), value => value);
const twelve = document.querySelector('#twelve');
initTimeScroller(twelve, twelve.querySelector('input'), twelve.querySelector('button'), value => {
    const [h, m] = value.split(':').map(Number);
    return `${h % 12 || 12}:${String(m).padStart(2, '0')} ${h % 24 < 12 ? 'AM' : 'PM'}`;
});
const slider = picker.querySelector('[role=slider]');
const narrow = document.querySelector('#narrow');
initTimeScroller(narrow, narrow.querySelector('input'), narrow.querySelector('button'), value => value);
const strip = picker.querySelector('.time-scroller-strip');
const assert = (condition, message) => { if (!condition) throw new Error(message); };
const key = value => slider.dispatchEvent(new KeyboardEvent('keydown', {key: value, bubbles: true, cancelable: true}));
let changes = 0;
input.addEventListener('change', () => changes++);
try {
    key('ArrowRight');
    assert(input.value === '12:05' && changes === 1, 'Keyboard commits exactly one five-minute step');
    key('End');
    assert(input.value === '24:00' && strip.style.transform === 'translateX(-75%)', 'End leaves half the viewport blank');
    key('Home');
    assert(input.value === '00:00' && strip.style.transform === 'translateX(25%)', 'Start leaves half the viewport blank');
    input.value = '12:03';
    input.dispatchEvent(new Event('change'));
    slider.dispatchEvent(new Event('blur'));
    assert(input.value === '12:03' && picker.querySelector('button').textContent === '12:03', 'Opening and focusing does not round an existing time');
    input.value = '12:00';
    input.dispatchEvent(new Event('change'));
    slider.dispatchEvent(new WheelEvent('wheel', {deltaY: 13, cancelable: true}));
    assert(input.value === '12:00', 'Wheel previews without saving during gesture');
    await new Promise(resolve => setTimeout(resolve, 220));
    const [h, m] = input.value.split(':').map(Number);
    assert((h * 60 + m) % 5 === 0 && input.value !== '12:00', 'Wheel snaps and saves after idle');
    input.disabled = true;
    await Promise.resolve();
    const saved = input.value;
    key('Home');
    assert(input.value === saved && slider.getAttribute('aria-disabled') === 'true', 'Disabled picker ignores input');
    input.disabled = false;
    input.value = '12:00';
    input.dispatchEvent(new Event('change'));
    assert(twelve.textContent.includes('12:00 AM'), 'AM/PM labels include midnight');
    document.querySelector('#result').textContent = 'All interaction checks passed.';
} catch (error) {
    document.querySelector('#result').textContent = 'FAILED: ' + error.message;
    throw error;
}
</script>
</html>
